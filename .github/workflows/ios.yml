# Builds Worklog on GitHub's macOS machines, so no Mac is needed.
# 1. "test" compiles the app and runs the XCTest suite in an iPhone Simulator.
# 2. "ipa" builds an unsigned Worklog-unsigned.ipa for the iPhone. Download it from the
#    run's Artifacts and install it from Windows with Sideloadly using your Apple ID.
name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: Native/Worklog-iOS

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Pick an iPhone simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
      - name: Build and run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Worklog.xcodeproj -scheme Worklog -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build/Simulator \
            -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test | tee build/test.log
      - name: Take screenshots with sample data
        run: |
          APP=build/Simulator/Build/Products/Debug-iphonesimulator/Worklog.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl ui "$SIM" appearance dark
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$SIM" "$APP"
          mkdir -p build/screenshots
          shoot() {
            xcrun simctl launch --terminate-running-process "$SIM" "$BUNDLE" -WorklogDemo "$@" > /dev/null
            sleep 6
            xcrun simctl io "$SIM" screenshot "build/screenshots/$NAME.png"
          }
          NAME=1-trips shoot -WorklogTab 0
          NAME=2-start-trip shoot -WorklogTab 0 -WorklogShowStart
          NAME=3-receipts shoot -WorklogTab 1
          NAME=4-add-receipt shoot -WorklogTab 1 -WorklogShowAddReceipt
          NAME=5-schedule shoot -WorklogTab 2
          NAME=6-settings shoot -WorklogTab 3
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Native/Worklog-iOS/build/screenshots
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            Native/Worklog-iOS/build/Tests.xcresult
            Native/Worklog-iOS/build/test.log

  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Worklog.xcodeproj -scheme Worklog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build/device.log
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Device/Build/Products/Release-iphoneos/Worklog.app Payload/
          zip -qry Worklog-unsigned.ipa Payload
          ls -lh Worklog-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Worklog-unsigned-ipa
          path: Native/Worklog-iOS/Worklog-unsigned.ipa
