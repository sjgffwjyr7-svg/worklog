# XcodeGen spec: CI turns this into MyApp.xcodeproj, so no hand-written project file is needed.
# Replace MyApp, the bundle ID and the usage descriptions; delete keys the app does not use.
name: MyApp
options:
  bundleIdPrefix: au.com.farmwest
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MyApp:
    type: application
    platform: iOS
    sources: [MyApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.farmwest.myapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Usage descriptions, only for features the app uses:
        # INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts."
        # INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Measure trips."
        # INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your records."
  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MyAppTests]
    dependencies: [{ target: MyApp }]
schemes:
  MyApp:
    build: { targets: { MyApp: all, MyAppTests: [test] } }
    test: { targets: [MyAppTests] }
